<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>لوحة الإدارة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="admin">
  <header class="mobile-header">
    <button class="menu-toggle" id="menuToggle" aria-label="القائمة"><i class="fas fa-bars"></i></button>
    <span class="mobile-header-title">الإدارة</span>
    <span style="width:42px"></span>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <button class="sidebar-close" id="sidebarClose" aria-label="إغلاق"><i class="fas fa-times"></i></button>
      <div class="sidebar-brand-icon"><i class="fab fa-whatsapp"></i></div>
      <div><h2>واتساب بوت</h2><span>لوحة التحكم</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html"><i class="fas fa-sliders-h"></i> التحكم</a>
      <a href="bulk.html"><i class="fas fa-paper-plane"></i> الإرسال الجماعي</a>
      <a class="active" href="admin.html"><i class="fas fa-users-cog"></i> الإدارة</a>
    </nav>
    <div class="sidebar-footer">WhatsApp Bot v1.0</div>
  </aside>

  <main class="main-content">
    <div class="page-wrap">
      <header class="page-header">
        <div>
          <h1 class="page-title">لوحة الإدارة</h1>
          <p class="page-sub">إدارة المستخدمين والصلاحيات</p>
        </div>
      </header>

      <section class="panel" id="admin-container">
        <div class="panel-head">
          <span class="panel-icon"><i class="fas fa-user-plus"></i></span>
          <h2>إضافة مستخدم</h2>
        </div>
        <div class="panel-body">
          <form id="add-user-form" class="field-grid">
            <div class="field"><label for="user-email">البريد</label><input type="email" id="user-email" required /></div>
            <div class="field"><label for="user-password">كلمة المرور</label><input type="password" id="user-password" required /></div>
            <div class="field toggle-field"><label>مدير</label><label class="switch"><input type="checkbox" id="perm-admin" /><span class="slider"></span></label></div>
            <div class="field toggle-field"><label>تشغيل البوت</label><label class="switch"><input type="checkbox" id="perm-control" /><span class="slider"></span></label></div>
            <div class="field toggle-field"><label>الإعدادات</label><label class="switch"><input type="checkbox" id="perm-settings" /><span class="slider"></span></label></div>
            <div class="field toggle-field"><label>الأرشيف</label><label class="switch"><input type="checkbox" id="perm-backlog" /><span class="slider"></span></label></div>
            <div class="field toggle-field"><label>الإرسال</label><label class="switch"><input type="checkbox" id="perm-send" /><span class="slider"></span></label></div>
            <div class="field toggle-field"><label>القوائم</label><label class="switch"><input type="checkbox" id="perm-lists" /><span class="slider"></span></label></div>
            <div class="field toggle-field"><label>التوجيه</label><label class="switch"><input type="checkbox" id="perm-forward" /><span class="slider"></span></label></div>
            <div class="field toggle-field"><label>السجلات</label><label class="switch"><input type="checkbox" id="perm-logs" /><span class="slider"></span></label></div>
            <div class="field" style="grid-column:1/-1"><button type="submit" class="primary">إضافة</button></div>
          </form>
        </div>
        <div class="panel-head" style="border-top:1px solid var(--slate-100)"><h2>المستخدمون</h2></div>
        <div class="panel-body"><div id="users-list" class="user-list"></div></div>
      </section>
    </div>
  </main>

  <nav class="mobile-bottom-nav">
    <a href="index.html"><i class="fas fa-sliders-h"></i> التحكم</a>
    <a href="bulk.html"><i class="fas fa-paper-plane"></i> الإرسال</a>
    <a class="active" href="admin.html"><i class="fas fa-users-cog"></i> الإدارة</a>
  </nav>

  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <button id="edit-close" class="ghost close">✕</button>
      <h3 class="modal-title">تعديل مستخدم</h3>
      <form id="edit-user-form" class="field-grid">
        <div class="field"><label>البريد</label><input type="email" id="edit-email" disabled /></div>
        <div class="field"><label for="edit-password">كلمة مرور جديدة</label><input type="password" id="edit-password" placeholder="اختياري" /></div>
        <div class="field toggle-field"><label>مدير</label><label class="switch"><input type="checkbox" id="edit-admin" /><span class="slider"></span></label></div>
        <div class="field toggle-field"><label>تشغيل</label><label class="switch"><input type="checkbox" id="edit-control" /><span class="slider"></span></label></div>
        <div class="field toggle-field"><label>إعدادات</label><label class="switch"><input type="checkbox" id="edit-settings" /><span class="slider"></span></label></div>
        <div class="field toggle-field"><label>أرشيف</label><label class="switch"><input type="checkbox" id="edit-backlog" /><span class="slider"></span></label></div>
        <div class="field toggle-field"><label>إرسال</label><label class="switch"><input type="checkbox" id="edit-send" /><span class="slider"></span></label></div>
        <div class="field toggle-field"><label>قوائم</label><label class="switch"><input type="checkbox" id="edit-lists" /><span class="slider"></span></label></div>
        <div class="field toggle-field"><label>توجيه</label><label class="switch"><input type="checkbox" id="edit-forward" /><span class="slider"></span></label></div>
        <div class="field toggle-field"><label>سجلات</label><label class="switch"><input type="checkbox" id="edit-logs" /><span class="slider"></span></label></div>
        <div class="field" style="grid-column:1/-1"><button type="submit" class="primary">حفظ</button></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="client.js"></script>
</body>
</html>
